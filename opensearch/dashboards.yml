server.host: 0.0.0.0
server.port: 5601

opensearch.hosts:
  - "http://opensearch:9200"

opensearch.username: admin
opensearch.password: admin

opensearch.request_headers_whitelist:
  - Authorization
  - securitytenant

opensearch.ssl.verification_mode: none

opensearch_dashboards.multitenancy.enabled: false

# Imports dashboards, visualizations and the data view on every start.
opensearch_dashboards.provision:
  - opensearch_dashboards:
      saved_objects:
        path: /usr/share/opensearch-dashboards/saved_objects
        overwrite: true